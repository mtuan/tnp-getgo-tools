<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./icons/getgo-icon-blue.png" />
    <title>GetGo Tools</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      html, body { background: #f4f5f2; }
      .startup-shell { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .startup-shell-icon { display: grid; place-items: center; width: 104px; height: 104px; border-radius: 28px; background: linear-gradient(145deg, #4f46e5, #7c3aed); box-shadow: 0 18px 44px rgb(79 70 229 / 24%); }
      .startup-shell-icon img { width: 76px; height: 76px; object-fit: contain; }
      .startup-shell strong { font-size: 24px; }
      .startup-shell span { color: #64748b; }
      .startup-shell-progress { width: 220px; height: 5px; overflow: hidden; border-radius: 999px; background: rgb(148 163 184 / 22%); }
      .startup-shell-progress i { display: block; width: 42%; height: 100%; border-radius: inherit; background: #5b4df7; animation: startup-shell-progress 1.1s ease-in-out infinite alternate; }
      @keyframes startup-shell-progress { from { transform: translateX(-15%); } to { transform: translateX(155%); } }
      @media (prefers-color-scheme: dark) { html, body { background: #111a2e; } .startup-shell { color: #f5f7ff; } .startup-shell span { color: #aab4ca; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell" role="status" aria-live="polite">
        <div class="startup-shell-icon"><img src="./icons/getgo-icon-blue.png" alt="" /></div>
        <strong>GetGo Tools</strong>
        <span>Preparing your workspace…</span>
        <div class="startup-shell-progress" aria-hidden="true"><i></i></div>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
