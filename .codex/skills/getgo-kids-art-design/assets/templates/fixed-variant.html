  <style>
    :root { color-scheme: light; --surface: #fffdf8; --text: #17213c; --overlay: transparent; }
    html[data-theme="dark"] { color-scheme: dark; --surface: #20243a; --text: #f8f6ff; --overlay: rgba(16,18,48,.48); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; color: var(--text); font-family: system-ui, sans-serif; }
    .artwork, .theme-overlay { position: fixed; inset: 0; pointer-events: none; }
    .artwork { width: 100%; height: 100%; object-fit: cover; }
    .theme-overlay { background: var(--overlay); }
    main { position: relative; z-index: 1; }
  </style>
</head>
