  <link rel="stylesheet" href="../../shared/demo-shell.css">
  <style>
    :root { color-scheme: light; --surface: #fffdf8; --text: #17213c; }
    html[data-theme="dark"] { color-scheme: dark; --surface: #20243a; --text: #f8f6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; color: var(--text); font-family: system-ui, sans-serif; }
    .artwork { position: fixed; inset: 0; pointer-events: none; }
    .artwork { width: 100%; height: 100%; object-fit: cover; }
    main { position: relative; z-index: 1; }
  </style>
</head>
