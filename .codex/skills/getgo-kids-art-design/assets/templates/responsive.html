<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replace with page title</title>
  <style>
    :root { color-scheme: light; --surface: #fffdf8; --text: #17213c; --overlay: transparent; }
    html[data-theme="dark"] { color-scheme: dark; --surface: #20243a; --text: #f8f6ff; --overlay: rgba(16,18,48,.48); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; color: var(--text); font-family: system-ui, sans-serif; }
    .artwork, .theme-overlay { position: fixed; inset: 0; pointer-events: none; }
    .artwork { width: 100%; height: 100%; object-fit: cover; }
    .artwork--landscape { display: none; }
    .theme-overlay { background: var(--overlay); }
    .theme-toggle, main { position: relative; z-index: 1; }
    .theme-toggle { min-width: 44px; min-height: 44px; }
    @media (orientation: landscape) and (min-width: 700px) {
      .artwork--portrait { display: none; }
      .artwork--landscape { display: block; }
    }
  </style>
</head>
<body>
  <img class="artwork artwork--portrait" src="../assets/replace-portrait-background.png" alt="">
  <img class="artwork artwork--landscape" src="../assets/replace-landscape-background.png" alt="">
  <div class="theme-overlay" aria-hidden="true"></div>
  <button class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
  <main>
    <!-- Replace with exact semantic content and controls from Screenshot Manager. -->
  </main>
  <script>
    const toggle = document.querySelector('.theme-toggle');
    const initialDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const setTheme = dark => {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      toggle.setAttribute('aria-pressed', String(dark));
      toggle.textContent = dark ? 'Light mode' : 'Dark mode';
    };
    setTheme(initialDark);
    toggle.addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'dark'));
  </script>
</body>
</html>
